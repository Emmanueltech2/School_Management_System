<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Offline - Elite Soft SMS</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f9fc;
        color: #0f172a;
      }

      main {
        width: min(92vw, 460px);
        padding: 32px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgb(15 23 42 / 0.08);
      }

      .mark {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #059669;
        color: #ffffff;
        font-weight: 800;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        margin-top: 24px;
        min-height: 42px;
        align-items: center;
        border-radius: 6px;
        background: #059669;
        padding: 0 18px;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">ES</div>
      <h1>You are offline</h1>
      <p>
        Elite Soft SMS needs an internet connection for live school records, payments, invoices, and receipts.
        Reconnect, then try again.
      </p>
      <a href="/dashboard">Try dashboard</a>
    </main>
  </body>
</html>
